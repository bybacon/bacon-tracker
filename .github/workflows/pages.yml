name: Pages

# Publishes site/ - the landing page at tracker.bybacon.com - to GitHub Pages.
# The board screenshots in site/images are symlinks into docs/images, so the
# README and the site share the files and the page also opens straight from
# disk. The custom domain is a repository Pages setting; a CNAME file is
# ignored for workflow deploys.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/images/board.png"
      - "docs/images/board-dark.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'bybacon/bacon-tracker'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble the site
        run: |
          mkdir _site
          cp -RL site/. _site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
